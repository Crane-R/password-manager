#機能ガイド
function.head0=ロック画面
function.head0.function=機能
function.head0.des=説明
function.head0.d1=クリックすると新規シーンモードに入ります。新しいキーを入力すると、まったく新しいシーンへ直接入れます。
function.head0.d2=クリックするとシーンログインモードに入ります。既存キーを入力してそのシーンへ入ります。
function.head0.f3=多言語
function.head0.d3=ガイドボタン右側の三角ボタンを押すと言語一覧が開きます。任意の項目を選ぶと、その言語で再起動します。中国語以外は、文字が長い・一部欠落するなど互換性が十分でない場合があります。
function.head0.d4=クリックするとDBモードへ切り替わります。保存先がデータベースに変わるため、使用前に設定が必要な場合があります。
function.head0.d5=クリックするとファイルモードへ切り替わります。保存先はExcelファイルになり、追加設定は不要です。
function.head0.d6=クリックするとDB設定がリモートサーバープロファイルへ切り替わります（アプリにはリモート・ローカル両方のDB設定があります）。
function.head0.d7=クリックするとDB設定がローカルへ戻ります。
function.head1=メイン画面
function.head1.function=機能
function.head1.des=説明
function.head1.f1=活性時間
function.head1.d1=一定時間操作がないとロック画面へ戻る安全機能です。時間は設定で変更でき、無効化も可能です。
function.head1.d2=活性時間をロックします。
function.head1.d3=解除して活性時間を更新します。
function.head1.d4=アカウントを検索し、暗号化状態のまま表示します。
function.head1.d5=検索結果をすべて復号します。
function.head1.d6=メイン画面を閉じて追加画面を開きます。
function.head1.d7=検索結果とメッセージ出力欄をクリアします。
function.head1.f8=PM3.0
function.head1.d8=この機能は v3.0 用です。v3.0 以外のデータを導入すると、データ異常などの問題が起こる可能性があります。
function.head1.f9=PM4.2
function.head1.d9=この機能は v4.2 用です。v4.2 以外のデータを導入すると、データ異常などの問題が起こる可能性があります。

