function.head0.f3=Language
function.head0.d3=Click the triangle button to the right of the Guide button to open the language list. Click any item to restart in that language. Languages other than Chinese may still have compatibility issues such as long text or missing labels.
function.head0.d4=Click to switch to database mode. This changes the storage backend to a database, which may require extra setup before use.
function.head0.d5=Click to switch to file mode. Data is stored in Excel files and no extra setup is required.
function.head0.d6=Click to switch the database config to the remote server profile (the app includes both remote and local DB configs).
function.head0.d7=Click to switch the database config back to local.
